# 行情 quotes API health（POST + Token 头）
timezone: Asia/Shanghai

url: https://terminal.sfccn.com/terminal/quotes/api/health
method: POST
# 勿把 Token 写进仓库；在 config/health.env 或环境变量中设置
token_env: QUOTES_HEALTH_TOKEN
request_timeout_seconds: 30
expected_status: UP

notify: on-call

wecom:
  webhook_env: WECOM_WEBHOOK_URL_HEALTH
