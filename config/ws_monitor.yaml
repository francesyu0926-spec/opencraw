# §2.2 WebSocket 接口监控（模拟客户端探活）
timezone: Asia/Shanghai

# 08:30–09:00 不监控（文档要求）
skip_window:
  start: "08:30"
  end: "09:00"

# 建议任务计划：每 10 分钟执行 python -m scripts.cron_task_monitor --ws-monitor

url: wss://terminal.sfccn.com/terminal/quotes/wsUrl/ws-quote
connect_timeout_seconds: 15
hold_seconds: 30
notify: 高德建

wecom:
  webhook_env: WECOM_WEBHOOK_URL_WS

subscribe_message:
  id: get_index_info
  action: subscribe
  topic: quote
  code: "000001.SH,399001.SZ,399006.SZ,000688.SH,399300.SZ,000905.SH"
  fields:
    - code
    - name
    - lastPrice
    - preClosePrice
    - amount
    - change
    - changeRate
