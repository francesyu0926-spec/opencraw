# §2.1 定时任务监控清单（与运维 PDF 对齐，2026 版任务时间）
timezone: Asia/Shanghai

# 任务计划：每天 00:00–05:00 每 15 分钟执行脚本（见 config/schedule.example.cron）
monitor_mode: elk
query_time_mode: rolling_in_batch
schedule:
  interval_minutes: 15
  active_start: "00:00"
  active_end: "05:00"
batch_window:
  start: "00:00"
  end: "05:00"
critical_window:
  start: "08:30"
  end: "09:15"

late_start_threshold_minutes: 5
overrun_after_end_threshold_minutes: 10

monitor_log_prefix: "[TASK_MONITOR]"

elasticsearch:
  url: http://dcelk.sfccn.com:9200
  username: quotemonitor
  message_field: msg
  # query_time_mode=batch_window 时以下两项忽略；改为 elastic 模式时生效
  timestamp_gte: now/d
  timestamp_lte: now
  query_size: 1000
  indices:
    - logstash-zxt-terminal-task-*
    - logstash-sync-mongo-*

tasks:
  # --- logstash-sync-mongo-* / 124.220.0.191 ---
