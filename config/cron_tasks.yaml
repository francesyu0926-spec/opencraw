# §2.1 定时任务监控清单（与运维文档对齐，可按现网调整）
timezone: Asia/Shanghai

# 监控仅通过 Elasticsearch；log_dir / server 字段仅供文档对照，脚本不会 SSH 或读本地目录
monitor_mode: elk

# 未按时启动：实际开始时间晚于 scheduled_start 超过该分钟数
late_start_threshold_minutes: 5
# 执行超时：在 expected_end 之后仍未成功结束超过该分钟数
overrun_after_end_threshold_minutes: 10

# 日志打点约定（推荐开发在任务中输出，便于 ELK 与本地文件统一解析）
# [TASK_MONITOR] task=<id> event=start|end status=success|failure message=...
monitor_log_prefix: "[TASK_MONITOR]"

# Elasticsearch（密码勿写入仓库，见 config/elk.env.example）
elasticsearch:
  url: http://dcelk.sfccn.com:9200
  username: quotemonitor
  message_field: msg
  # 定时任务：查当天日志；若做 15 分钟滚动探活可改为 now-15m
  timestamp_gte: now/d
  timestamp_lte: now
  query_size: 1000

tasks:
