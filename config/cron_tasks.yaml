    scheduled_start: "01:00"
    expected_end: "01:03"
    log_index_pattern: "logstash-sync-mongo-*"
    server: "124.220.0.191"
    log_dir: "/data/zxt/sync-mongo/logs"
    log_glob: "*.log"
    notify: 阳祥风

