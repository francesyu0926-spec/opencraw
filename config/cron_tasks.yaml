# §2.1 定时任务监控清单（与运维 PDF 对齐，2026 版任务时间）
timezone: Asia/Shanghai

# 业务任务计划时刻见下方 tasks[]；统一调度在 0–5 点按各任务监控窗触发 ELK（见 monitor_schedule.production.yaml）
monitor_mode: elk
query_time_mode: rolling_in_batch
schedule:
  interval_minutes: 5
  active_start: "00:00"
  active_end: "05:00"
batch_window:
  start: "00:00"
  end: "05:00"
critical_window:
  start: "08:30"
  end: "09:15"

late_start_threshold_minutes: 6
overrun_after_end_threshold_minutes: 11

monitor_log_prefix: "[TASK_MONITOR]"

# §2.1 告警机器人（与 §2.2 的 WECOM_WEBHOOK_URL_WS 分开）
wecom:
  webhook_env: WECOM_WEBHOOK_URL_ELK

elasticsearch:
  url: http://43.139.37.118:9200
  username: quotemonitor
  message_field: msg
  # query_time_mode=batch_window 时以下两项忽略；改为 elastic 模式时生效
  timestamp_gte: now/d
  timestamp_lte: now
  query_size: 1000
  indices:
    - logstash-zxt-terminal-task-*
    - logstash-sync-mongo-*

tasks:
