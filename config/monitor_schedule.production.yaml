# 生产监控时刻表（由 scripts/run_monitor_production.* 使用）
# 任务计划 / cron：每 5 分钟触发调度器（与各 job 间隔 10/15 分钟对齐）
timezone: Asia/Shanghai

dispatcher_interval_minutes: 5

# 临时（约 7 天）：整点（:00）对本轮已执行的 job 发企微（成功或失败均发）
notify_success_trial:
  enabled: true
  on_hour_only: true
  until: "2026-11-11"

jobs:
  elk:
    enabled: true
    description: ELK 数据同步定时任务监控（§2.1）
    interval_minutes: 15
    active_start: "00:00"
    active_end: "05:00"
    config: config/cron_tasks.yaml

  ws:
    enabled: true
    description: WebSocket 模拟客户端探活（每 10 分钟，维持>30s 后主动断连）
    interval_minutes: 10
    active_start: "09:00"
    active_end: "15:30"
    config: config/ws_monitor.yaml

  health:
    enabled: true
    description: 行情 HTTP 接口 health 探活
    interval_minutes: 15
    active_start: "09:00"
    active_end: "23:39"
    config: config/health_monitor.yaml

  writing:
    enabled: true
    description: 自动化写稿任务验证（zxtop 盘前/早报等 7 项，失败企微告警）
    interval_minutes: 5
    active_start: "07:00"
    active_end: "20:30"
    config: config/writing_monitor.yaml
