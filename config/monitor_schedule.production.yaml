# 生产监控时刻表（由 scripts/run_monitor_production.* 使用）
# 任务计划 / cron：每 15 分钟触发一次调度器（全天）
timezone: Asia/Shanghai

dispatcher_interval_minutes: 15

jobs:
  elk:
    enabled: true
    description: ELK 数据同步定时任务监控（§2.1）
    interval_minutes: 15
    active_start: "00:00"
    active_end: "05:00"
    config: config/cron_tasks.yaml

  ws:
    enabled: true
    description: WebSocket 行情接口探活
    interval_minutes: 15
    active_start: "09:00"
    active_end: "15:30"
    config: config/ws_monitor.yaml

  health:
    enabled: true
    description: 行情 HTTP 接口 health 探活
    interval_minutes: 15
    active_start: "09:00"
    active_end: "23:39"
    config: config/health_monitor.yaml
